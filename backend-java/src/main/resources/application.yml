server:
  port: 8080

spring:
  datasource:
    url: jdbc:h2:file:./.repolens-java/db/repolens;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info

repolens:
  version: v1
  workspace-root: ./.repolens-java/repos
  index-root: ./.repolens-java/indexes
  indexing:
    async-enabled: true
    max-active-tasks-per-repository: 1
  retrieval:
    default-top-k: 10
    vector-enabled: true
    graph-enabled: true
    vector-dimensions: 64
  scanner:
    max-file-size-bytes: 1048576
    follow-symlinks: false
