spring:
  datasource:
    url: jdbc:h2:file:./.repolens-java/demo-db/repolens;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

repolens:
  version: v1-demo
  workspace-root: ./.repolens-java/demo-repos
  index-root: ./.repolens-java/demo-indexes
  indexing:
    async-enabled: true
  retrieval:
    vector-enabled: true
    graph-enabled: true
    vector-dimensions: 64
  change-request:
    timeout-seconds: 20
    max-diff-chars: 200000
