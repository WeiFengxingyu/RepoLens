services:
  backend:
    build:
      context: ./backend
    container_name: repolens-backend
    env_file:
      - .env.example
    environment:
      REPOLENS_QDRANT_URL: http://qdrant:6333
      REPOLENS_DATABASE_URL: sqlite:///./.repolens/repolens.sqlite
    ports:
      - "8000:8000"
    volumes:
      - repolens_data:/app/.repolens
    depends_on:
      - qdrant

  frontend:
    build:
      context: ./frontend
    container_name: repolens-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  qdrant:
    image: qdrant/qdrant:latest
    container_name: repolens-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  repolens_data:
  qdrant_data:

