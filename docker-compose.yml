services:
  backend:
    build:
      context: ./backend
    container_name: repolens-backend
    environment:
      REPOLENS_ENV: production
      REPOLENS_DATABASE_URL: sqlite:////app/.repolens/repolens.sqlite
      REPOLENS_WORKSPACE_ROOT: /app/.repolens/repos
      REPOLENS_QDRANT_URL: http://qdrant:6333
      REPOLENS_CORS_ORIGINS: ${REPOLENS_CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      REPOLENS_EMBEDDING_BASE_URL: ${REPOLENS_EMBEDDING_BASE_URL:-}
      REPOLENS_EMBEDDING_API_KEY: ${REPOLENS_EMBEDDING_API_KEY:-}
      REPOLENS_EMBEDDING_MODEL: ${REPOLENS_EMBEDDING_MODEL:-}
      REPOLENS_EMBEDDING_DIMENSION: ${REPOLENS_EMBEDDING_DIMENSION:-}
      REPOLENS_CHAT_BASE_URL: ${REPOLENS_CHAT_BASE_URL:-}
      REPOLENS_CHAT_API_KEY: ${REPOLENS_CHAT_API_KEY:-}
      REPOLENS_CHAT_MODEL: ${REPOLENS_CHAT_MODEL:-}
      REPOLENS_CHAT_TEMPERATURE: ${REPOLENS_CHAT_TEMPERATURE:-0.2}
      REPOLENS_CHAT_TIMEOUT_SECONDS: ${REPOLENS_CHAT_TIMEOUT_SECONDS:-60}
      REPOLENS_SAFE_STATIC_CHECK_ENABLED: ${REPOLENS_SAFE_STATIC_CHECK_ENABLED:-false}
      REPOLENS_SAFE_STATIC_CHECK_ALLOWED_CHECKERS: ${REPOLENS_SAFE_STATIC_CHECK_ALLOWED_CHECKERS:-python_ast_parse}
    ports:
      - "8000:8000"
    volumes:
      - repolens_data:/app/.repolens
    depends_on:
      - qdrant

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    container_name: repolens-frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend

  qdrant:
    image: qdrant/qdrant:latest
    container_name: repolens-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  repolens_data:
  qdrant_data:
