[project]
name = "repolens-backend"
version = "0.1.0"
description = "FastAPI backend for RepoLens."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "langgraph>=1.2.0",
  "networkx>=3.0.0",
  "uvicorn[standard]>=0.30.0",
  "sqlalchemy>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "httpx>=0.27.0",
  "ruff>=0.6.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 100
target-version = "py311"
